name: Compare APK Files

on:
  workflow_dispatch:
    inputs:
      apk1_url:
        description: "APK 1 URL (reference)"
        required: true
        type: string

      apk2_url:
        description: "APK 2 URL (F-Droid / built)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare APK contents
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Download both APKs
      # ------------------------------------------------------------

      - name: Download APKs
        env:
          APK1_URL: ${{ inputs.apk1_url }}
          APK2_URL: ${{ inputs.apk2_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p input

          echo "Downloading APK 1..."
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$APK1_URL" \
            -o input/apk1.apk

          echo "Downloading APK 2..."
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$APK2_URL" \
            -o input/apk2.apk

          echo
          echo "APK sizes:"
          ls -lh input/apk1.apk input/apk2.apk

          echo
          echo "APK SHA-256:"
          sha256sum input/apk1.apk
          sha256sum input/apk2.apk

      # ------------------------------------------------------------
      # Compare ZIP entries directly
      # ------------------------------------------------------------

      - name: Compare APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p differences/apk1
          mkdir -p differences/apk2
          mkdir -p report

          python3 <<'PY'
          import hashlib
          import os
          import zipfile
          import shutil

          APK1 = "input/apk1.apk"
          APK2 = "input/apk2.apk"

          OUT1 = "differences/apk1"
          OUT2 = "differences/apk2"

          REPORT = "report/differences.txt"

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def read_zip(path):
              result = {}

              with zipfile.ZipFile(path, "r") as z:
                  for info in z.infolist():
                      name = info.filename

                      # Ignore directory entries.
                      if name.endswith("/"):
                          continue

                      data = z.read(info)

                      result[name] = {
                          "hash": sha256(data),
                          "size": len(data),
                          "info": info,
                      }

              return result

          print("Reading APK 1...")
          apk1 = read_zip(APK1)

          print("Reading APK 2...")
          apk2 = read_zip(APK2)

          all_files = sorted(set(apk1) | set(apk2))

          changed = []
          only_apk1 = []
          only_apk2 = []
          same = []

          with zipfile.ZipFile(APK1, "r") as z1, \
               zipfile.ZipFile(APK2, "r") as z2:

              for name in all_files:

                  # File exists only in APK 1
                  if name not in apk2:
                      only_apk1.append(name)

                      destination = os.path.join(OUT1, name)
                      os.makedirs(
                          os.path.dirname(destination),
                          exist_ok=True
                      )

                      with z1.open(name) as src, \
                           open(destination, "wb") as dst:
                          shutil.copyfileobj(src, dst)

                      continue

                  # File exists only in APK 2
                  if name not in apk1:
                      only_apk2.append(name)

                      destination = os.path.join(OUT2, name)
                      os.makedirs(
                          os.path.dirname(destination),
                          exist_ok=True
                      )

                      with z2.open(name) as src, \
                           open(destination, "wb") as dst:
                          shutil.copyfileobj(src, dst)

                      continue

                  # File exists in both
                  hash1 = apk1[name]["hash"]
                  hash2 = apk2[name]["hash"]

                  if hash1 == hash2:
                      same.append(name)
                      continue

                  changed.append(name)

                  # Extract ONLY this changed file from APK 1
                  destination1 = os.path.join(OUT1, name)

                  os.makedirs(
                      os.path.dirname(destination1),
                      exist_ok=True
                  )

                  with z1.open(name) as src, \
                       open(destination1, "wb") as dst:
                      shutil.copyfileobj(src, dst)

                  # Extract ONLY this changed file from APK 2
                  destination2 = os.path.join(OUT2, name)

                  os.makedirs(
                      os.path.dirname(destination2),
                      exist_ok=True
                  )

                  with z2.open(name) as src, \
                       open(destination2, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          # --------------------------------------------------------
          # Report
          # --------------------------------------------------------

          with open(REPORT, "w", encoding="utf-8") as f:

              f.write("APK FILE COMPARISON\n")
              f.write("===================\n\n")

              f.write(f"APK 1 total files: {len(apk1)}\n")
              f.write(f"APK 2 total files: {len(apk2)}\n")
              f.write(f"Identical files: {len(same)}\n")
              f.write(f"Changed files: {len(changed)}\n")
              f.write(f"Only in APK 1: {len(only_apk1)}\n")
              f.write(f"Only in APK 2: {len(only_apk2)}\n")

              f.write("\n\n")

              f.write("CHANGED FILES\n")
              f.write("=============\n")

              for name in changed:
                  f.write(f"\n{name}\n")
                  f.write(
                      f"  APK1 SHA256: {apk1[name]['hash']}\n"
                  )
                  f.write(
                      f"  APK2 SHA256: {apk2[name]['hash']}\n"
                  )
                  f.write(
                      f"  APK1 size:   {apk1[name]['size']} bytes\n"
                  )
                  f.write(
                      f"  APK2 size:   {apk2[name]['size']} bytes\n"
                  )

              f.write("\n\n")

              f.write("ONLY IN APK 1\n")
              f.write("=============\n")

              for name in only_apk1:
                  f.write(name + "\n")

              f.write("\n\n")

              f.write("ONLY IN APK 2\n")
              f.write("=============\n")

              for name in only_apk2:
                  f.write(name + "\n")

          # --------------------------------------------------------
          # GitHub summary
          # --------------------------------------------------------

          print()
          print("========================================")
          print("APK COMPARISON")
          print("========================================")
          print(f"APK 1 files    : {len(apk1)}")
          print(f"APK 2 files    : {len(apk2)}")
          print(f"Identical      : {len(same)}")
          print(f"Changed        : {len(changed)}")
          print(f"Only APK 1     : {len(only_apk1)}")
          print(f"Only APK 2     : {len(only_apk2)}")
          print("========================================")

          print()
          print("CHANGED FILES:")
          for name in changed:
              print(f"  {name}")

          print()
          print("ONLY IN APK 1:")
          for name in only_apk1:
              print(f"  {name}")

          print()
          print("ONLY IN APK 2:")
          for name in only_apk2:
              print(f"  {name}")

          # GitHub Actions summary
          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write("# APK Comparison\n\n")

              f.write("| Category | Count |\n")
              f.write("|---|---:|\n")
              f.write(f"| APK 1 files | {len(apk1)} |\n")
              f.write(f"| APK 2 files | {len(apk2)} |\n")
              f.write(f"| Identical | {len(same)} |\n")
              f.write(f"| Changed | {len(changed)} |\n")
              f.write(f"| Only APK 1 | {len(only_apk1)} |\n")
              f.write(f"| Only APK 2 | {len(only_apk2)} |\n\n")

              f.write("## Changed files\n\n")

              if changed:
                  for name in changed:
                      f.write(f"- `{name}`\n")
              else:
                  f.write("No changed files.\n")

              f.write("\n## Only in APK 1\n\n")

              if only_apk1:
                  for name in only_apk1:
                      f.write(f"- `{name}`\n")
              else:
                  f.write("None.\n")

              f.write("\n## Only in APK 2\n\n")

              if only_apk2:
                  for name in only_apk2:
                      f.write(f"- `{name}`\n")
              else:
                  f.write("None.\n")
          PY

      # ------------------------------------------------------------
      # Upload ONLY files that actually differ
      # ------------------------------------------------------------

      - name: Upload differing files
        uses: actions/upload-artifact@v7
        with:
          name: apk-differences
          path: differences/
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # Upload comparison report
      # ------------------------------------------------------------

      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: apk-comparison-report
          path: report/
          if-no-files-found: error
          retention-days: 14
