name: F-Droid Metadata Build Check

# Whenever a PR modifies /metadata/*.yml (for example,
# metadata/moe.rukamori.archivetune.yml), this workflow builds the new/changed
# Build entries in that PR using F-Droid's own buildserver-trixie image,
# following the same process as F-Droid:
# fdroid fetchsrclibs + fdroid build --on-server --test
# This ensures the same commit and the same build tooling are used.
#
# The workflow can also be triggered manually with workflow_dispatch to build
# a specific appid:versionCode (provided through the "target" input),
# even without a PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'metadata/*.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Manually build a specific appid:versionCode (leave empty to auto-detect from the PR diff)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1) Detect new/changed (appid, versionCode) targets in the PR
  # ---------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
      has_targets: ${{ steps.find.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          # NOTE: fetch-depth 0 fetches the complete Git history so we can
          # compare the base and head commits. For very large repositories
          # (such as the actual fdroiddata repository), this may be slower.
          # If needed, you can reduce this to a reasonable depth.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: pip install --quiet pyyaml

      - id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TARGET:-}" ]; then
            APPID="${MANUAL_TARGET%%:*}"
            VC="${MANUAL_TARGET##*:}"
            TARGETS_JSON="[{\"appid\":\"$APPID\",\"versionCode\":$VC,\"target\":\"$MANUAL_TARGET\"}]"
          else
            git fetch origin "$BASE_SHA" "$HEAD_SHA" --depth=1 || true
            TARGETS_JSON="$(python3 .github/scripts/find_changed_builds.py)"
          fi

          echo "Detected targets: $TARGETS_JSON"
          echo "targets=$TARGETS_JSON" >> "$GITHUB_OUTPUT"

          if [ "$TARGETS_JSON" = "[]" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 2) Build each new/changed target using F-Droid's buildserver-trixie image
  # ---------------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Clone fdroidserver from master (F-Droid's own CI does the same)
        run: git clone --depth=1 https://gitlab.com/fdroid/fdroidserver.git "${{ runner.temp }}/fdroidserver"

      - name: Allow read/write access for the container (vagrant user)
        run: |
          chmod -R o+rwX "${{ github.workspace }}"
          chmod -R o+rwX "${{ runner.temp }}/fdroidserver"

      - name: Pull F-Droid's buildserver-trixie image
        run: docker pull registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie

      - name: "Build: ${{ matrix.target }}"
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          docker run --rm \
            -u vagrant \
            -e BUILD_TARGET \
            -v "${{ github.workspace }}:/build" \
            -v "${{ runner.temp }}/fdroidserver:/home/vagrant/fdroidserver" \
            -w /build \
            --entrypoint /bin/bash \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            /build/.github/scripts/run_fdroid_build.sh

      # Upload all three artifact sets with if: always(), so build logs and
      # partial build output are preserved even when the build fails.
      # This makes failures easier to debug, such as reproducibility failures.

      - name: "Upload: complete build (60-day retention)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-full-build-${{ matrix.appid }}-${{ matrix.versionCode }}
          path: |
            build/
            unsigned/
            logs/
            tmp/
          retention-days: 60
          if-no-files-found: warn

      - name: "Upload: APK (separate)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-apk-${{ matrix.appid }}-${{ matrix.versionCode }}
          path: unsigned/*.apk
          retention-days: 60
          if-no-files-found: warn

      - name: "Upload: build logs (separate)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-logs-${{ matrix.appid }}-${{ matrix.versionCode }}
          path: logs/
          retention-days: 60
          if-no-files-found: warn
