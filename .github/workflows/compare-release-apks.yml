name: Compare Release APKs

on:
  workflow_dispatch:
    inputs:
      developer_apk_url:
        description: "Direct URL of the developer release APK"
        required: true
        type: string
      fdroid_apk_url:
        description: "Direct URL of the F-Droid/GitLab release APK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare APKs
    runs-on: ubuntu-latest

    steps:
      - name: Install base tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip python3 python3-pip python3-venv

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 and Build Tools
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d "$SDK_ROOT/platforms/android-37"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"

          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

          "$SDK_ROOT/build-tools/36.0.0/apksigner" version

          # Do not use `zipalign -h`: zipalign has no -h option.
          "$SDK_ROOT/build-tools/36.0.0/zipalign" 2>&1 \
            | head -n 3

      - name: Install APK reproducibility tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/apk-tools"
          TOOL_BIN="$RUNNER_TEMP/apk-tools/bin"

          "$TOOL_BIN/pip" install --upgrade pip

          "$TOOL_BIN/pip" install \
            "apksigcopier==1.1.1" \
            "repro-apk==0.3.0"

          echo "$TOOL_BIN" >> "$GITHUB_PATH"

          apksigcopier --version
          repro-apk --version || true

      - name: Download APKs
        env:
          DEVELOPER_APK_URL: ${{ inputs.developer_apk_url }}
          FDROID_APK_URL: ${{ inputs.fdroid_apk_url }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p input reports

          curl -fL --retry 6 --retry-delay 2 \
            --connect-timeout 30 \
            "$DEVELOPER_APK_URL" \
            -o input/developer.apk

          curl -fL --retry 6 --retry-delay 2 \
            --connect-timeout 30 \
            "$FDROID_APK_URL" \
            -o input/fdroid.apk

          test -s input/developer.apk
          test -s input/fdroid.apk

          file input/developer.apk input/fdroid.apk
          ls -lh input/*.apk

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "APK COMPARISON TOOLCHAIN"
            echo "========================"
            echo
            echo "Runner:"
            uname -a
            echo
            echo "Python:"
            python3 --version
            echo
            echo "apksigcopier:"
            apksigcopier --version || true
            echo
            echo "repro-apk:"
            repro-apk --version || true
            echo
            echo "apksigner:"
            apksigner version
            echo
            echo "Build Tools:"
            echo "$ANDROID_SDK_ROOT/build-tools/36.0.0/source.properties"
          } | tee reports/tool-versions.txt

      - name: Verify APK signatures
        shell: bash
        run: |
          set +e

          {
            echo "===== DEVELOPER APK ====="
            apksigner verify --verbose --print-certs input/developer.apk
            echo "exit=$?"

            echo
            echo "===== F-DROID APK ====="
            apksigner verify --verbose --print-certs input/fdroid.apk
            echo "exit=$?"
          } | tee reports/signature-verification.txt

      - name: Compare APK signatures and signed/unsigned content
        shell: bash
        run: |
          set +e

          {
            echo "===== apksigcopier compare ====="
            apksigcopier compare \
              input/developer.apk \
              input/fdroid.apk
            echo "normal compare exit=$?"

            echo
            echo "===== apksigcopier compare --unsigned ====="
            apksigcopier compare \
              --unsigned \
              input/developer.apk \
              input/fdroid.apk
            echo "unsigned compare exit=$?"
          } 2>&1 | tee reports/apksigcopier-compare.txt

          exit 0

      - name: Compare APK ZIP metadata
        shell: bash
        run: |
          set +e

          repro-apk diff-zip-meta \
            input/developer.apk \
            input/fdroid.apk \
            > reports/zip-metadata.diff \
            2>&1

          echo "repro-apk exit=$?"
          cat reports/zip-metadata.diff || true

          exit 0

      - name: Extract APK contents
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p extracted/developer extracted/fdroid

          unzip -q input/developer.apk -d extracted/developer
          unzip -q input/fdroid.apk -d extracted/fdroid

      - name: Compare every extracted entry by SHA-256
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          roots = {
              "developer": Path("extracted/developer"),
              "fdroid": Path("extracted/fdroid"),
          }

          def collect(root):
              return {
                  p.relative_to(root).as_posix(): p
                  for p in root.rglob("*")
                  if p.is_file()
              }

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  while chunk := f.read(1024 * 1024):
                      h.update(chunk)
              return h.hexdigest()

          dev = collect(roots["developer"])
          fd = collect(roots["fdroid"])

          common = sorted(set(dev) & set(fd))
          only_dev = sorted(set(dev) - set(fd))
          only_fd = sorted(set(fd) - set(dev))

          same = []
          changed = []

          for name in common:
              a = sha256(dev[name])
              b = sha256(fd[name])

              if a == b:
                  same.append(name)
              else:
                  changed.append((name, a, b))

          with open("reports/entry-content-hashes.txt", "w") as out:
              out.write("APK ENTRY CONTENT COMPARISON\n")
              out.write("============================\n\n")
              out.write(f"Developer entries: {len(dev)}\n")
              out.write(f"F-Droid entries: {len(fd)}\n")
              out.write(f"Common entries: {len(common)}\n")
              out.write(f"Identical contents: {len(same)}\n")
              out.write(f"Changed contents: {len(changed)}\n")
              out.write(f"Only developer: {len(only_dev)}\n")
              out.write(f"Only F-Droid: {len(only_fd)}\n\n")

              out.write("CHANGED ENTRY CONTENTS\n")
              out.write("=====================\n\n")

              for name, a, b in changed:
                  out.write(f"{name}\n")
                  out.write(f"  developer: {a}\n")
                  out.write(f"  fdroid:    {b}\n\n")

              out.write("ONLY IN DEVELOPER\n")
              out.write("=================\n\n")
              out.writelines(f"{x}\n" for x in only_dev)

              out.write("\nONLY IN F-DROID\n")
              out.write("===============\n\n")
              out.writelines(f"{x}\n" for x in only_fd)

          cat = Path("reports/entry-content-hashes.txt")
          print(cat.read_text())
          PY

      - name: Compare DEX directly
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          dev = Path("extracted/developer")
          fd = Path("extracted/fdroid")

          names = sorted(
              {p.name for p in dev.glob("classes*.dex")}
              | {p.name for p in fd.glob("classes*.dex")}
          )

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  while chunk := f.read(1024 * 1024):
                      h.update(chunk)
              return h.hexdigest()

          with open("reports/dex-hashes.txt", "w") as out:
              for name in names:
                  a = dev / name
                  b = fd / name

                  out.write(f"{name}\n")

                  if a.exists():
                      out.write(f"  developer: {sha256(a)}\n")
                  else:
                      out.write("  developer: MISSING\n")

                  if b.exists():
                      out.write(f"  fdroid:    {sha256(b)}\n")
                  else:
                      out.write("  fdroid:    MISSING\n")

                  if a.exists() and b.exists():
                      result = (
                          "IDENTICAL"
                          if sha256(a) == sha256(b)
                          else "DIFFERENT"
                      )
                      out.write(f"  result:    {result}\n")

                  out.write("\n")

          cat reports/dex-hashes.txt
          PY

      - name: Compare ZIP entry metadata
        shell: bash
        run: |
          set -euo pipefail

          unzip -lv input/developer.apk \
            > reports/unzip-list-developer.txt

          unzip -lv input/fdroid.apk \
            > reports/unzip-list-fdroid.txt

          diff -u \
            reports/unzip-list-developer.txt \
            reports/unzip-list-fdroid.txt \
            > reports/unzip-list.diff \
            || true

      - name: Run diffoscope 329
        shell: bash
        run: |
          set -euo pipefail

          docker pull \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest

          set +e

          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest \
            diffoscope \
              --text-color=never \
              --max-text-report-size=0 \
              input/developer.apk \
              input/fdroid.apk \
            > reports/diffoscope.txt \
            2>&1

          STATUS=$?

          echo "diffoscope exit=$STATUS"

          # 0 = identical, 1 = differences.
          # >=2 means diffoscope itself failed.
          if [ "$STATUS" -ge 2 ]; then
            exit "$STATUS"
          fi

      - name: Create compact GitHub summary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          entry = Path(
              "reports/entry-content-hashes.txt"
          ).read_text()

          dex = Path(
              "reports/dex-hashes.txt"
          ).read_text()

          stats = [
              x for x in entry.splitlines()
              if x.startswith((
                  "Developer entries:",
                  "F-Droid entries:",
                  "Common entries:",
                  "Identical contents:",
                  "Changed contents:",
                  "Only developer:",
                  "Only F-Droid:",
              ))
          ]

          dex_results = [
              x for x in dex.splitlines()
              if "result:" in x
          ]

          summary = [
              "# APK Comparison",
              "",
              "## Entry contents",
              "",
              "```text",
              *stats,
              "```",
              "",
              "## DEX",
              "",
              "```text",
              *dex_results,
              "```",
              "",
              "Full reports are in the uploaded artifact.",
          ]

          Path(
              "reports/SUMMARY.md"
          ).write_text("\n".join(summary) + "\n")

          print("\n".join(summary))
          PY

          cat reports/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: apk-comparison-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload extracted APK contents
        uses: actions/upload-artifact@v7
        with:
          name: apk-extracted-contents
          path: extracted/
          if-no-files-found: error
          retention-days: 7
