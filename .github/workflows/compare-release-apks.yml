name: Compare Release Zip APKs

on:
  workflow_dispatch:
    inputs:
      developer_apk_url:
        description: "Direct URL of the developer release APK"
        required: true
        type: string
      fdroid_apk_url:
        description: "Direct URL of the F-Droid/GitLab release APK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare APKs
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: "37.0"
      ANDROID_BUILD_TOOLS: "37.0.0"

    steps:
      - name: Install base tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            python3 \
            python3-pip \
            python3-venv

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d \
            "$SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"

          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -x \
            "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

          echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}" \
            >> "$GITHUB_PATH"

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail

          echo "SDK root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Platform: $ANDROID_PLATFORM"
          echo "Build Tools: $ANDROID_BUILD_TOOLS"

          echo
          echo "sdkmanager:"
          sdkmanager --version

          echo
          echo "apksigner:"
          apksigner version

          echo
          echo "zipalign:"
          zipalign 2>&1 | head -n 8 || true

          test -f \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms/android-${ANDROID_PLATFORM}/android.jar"

      - name: Install APK reproducibility tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/apk-tools"

          TOOL_BIN="$RUNNER_TEMP/apk-tools/bin"

          # Do not rely on the venv bin directory being reloaded into PATH
          # during this step. Invoke the installed executables explicitly.
          "$TOOL_BIN/python" -m pip install --upgrade pip

          "$TOOL_BIN/python" -m pip install \
            "apksigcopier==1.1.1" \
            "repro-apk==0.3.0"

          test -x "$TOOL_BIN/apksigcopier"
          test -x "$TOOL_BIN/repro-apk"

          echo "$TOOL_BIN" >> "$GITHUB_PATH"

          echo "apksigcopier:"
          "$TOOL_BIN/apksigcopier" --version

          echo
          echo "repro-apk:"
          "$TOOL_BIN/repro-apk" --version

      - name: Download APKs
        env:
          DEVELOPER_APK_URL: ${{ inputs.developer_apk_url }}
          FDROID_APK_URL: ${{ inputs.fdroid_apk_url }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p input reports

          curl -fL \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$DEVELOPER_APK_URL" \
            -o input/developer.apk

          curl -fL \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$FDROID_APK_URL" \
            -o input/fdroid.apk

          test -s input/developer.apk
          test -s input/fdroid.apk

          file input/developer.apk input/fdroid.apk
          ls -lh input/*.apk

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail

          TOOL_BIN="$RUNNER_TEMP/apk-tools/bin"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          {
            echo "APK COMPARISON TOOLCHAIN"
            echo "========================"
            echo
            echo "Runner:"
            uname -a
            echo
            echo "Python:"
            python3 --version
            echo
            echo "Android SDK manager:"
            sdkmanager --version
            echo
            echo "Android platform: $ANDROID_PLATFORM"
            echo "Android Build Tools: $ANDROID_BUILD_TOOLS"
            echo
            echo "apksigcopier:"
            "$TOOL_BIN/apksigcopier" --version
            echo
            echo "repro-apk:"
            "$TOOL_BIN/repro-apk" --version
            echo
            echo "apksigner:"
            "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" version
            echo
            echo "Build Tools source.properties:"
            cat "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/source.properties"
            echo
            echo "Platform source.properties:"
            cat "$SDK_ROOT/platforms/android-$ANDROID_PLATFORM/source.properties"
          } | tee reports/tool-versions.txt

      - name: Verify APK signatures
        shell: bash
        run: |
          set +e

          {
            echo "===== DEVELOPER APK ====="
            apksigner verify \
              --verbose \
              --print-certs \
              input/developer.apk
            echo "exit=$?"

            echo
            echo "===== F-DROID APK ====="
            apksigner verify \
              --verbose \
              --print-certs \
              input/fdroid.apk
            echo "exit=$?"
          } | tee reports/signature-verification.txt

      - name: Compare signatures with apksigcopier
        shell: bash
        run: |
          set +e

          TOOL_BIN="$RUNNER_TEMP/apk-tools/bin"

          {
            echo "===== apksigcopier compare ====="
            "$TOOL_BIN/apksigcopier" compare \
              input/developer.apk \
              input/fdroid.apk
            echo "normal compare exit=$?"

            echo
            echo "===== apksigcopier compare --unsigned ====="
            "$TOOL_BIN/apksigcopier" compare \
              --unsigned \
              input/developer.apk \
              input/fdroid.apk
            echo "unsigned compare exit=$?"
          } 2>&1 | tee reports/apksigcopier-compare.txt

          # Comparison differences are expected and must not stop
          # the diagnostic workflow.
          exit 0

      - name: Compare APK ZIP metadata
        shell: bash
        run: |
          set +e

          TOOL_BIN="$RUNNER_TEMP/apk-tools/bin"

          "$TOOL_BIN/repro-apk" diff-zip-meta \
            input/developer.apk \
            input/fdroid.apk \
            > reports/zip-metadata.diff \
            2>&1

          STATUS=$?

          echo "repro-apk exit=$STATUS"
          cat reports/zip-metadata.diff || true

          exit 0

      - name: Extract APK contents
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            extracted/developer \
            extracted/fdroid

          unzip -q \
            input/developer.apk \
            -d extracted/developer

          unzip -q \
            input/fdroid.apk \
            -d extracted/fdroid

      - name: Compare every extracted entry by SHA-256
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          roots = {
              "developer": Path("extracted/developer"),
              "fdroid": Path("extracted/fdroid"),
          }

          def collect(root):
              return {
                  p.relative_to(root).as_posix(): p
                  for p in root.rglob("*")
                  if p.is_file()
              }

          def sha256(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)

              return h.hexdigest()

          dev = collect(roots["developer"])
          fd = collect(roots["fdroid"])

          common = sorted(set(dev) & set(fd))
          only_dev = sorted(set(dev) - set(fd))
          only_fd = sorted(set(fd) - set(dev))

          same = []
          changed = []

          for name in common:
              a = sha256(dev[name])
              b = sha256(fd[name])

              if a == b:
                  same.append(name)
              else:
                  changed.append((name, a, b))

          with open(
              "reports/entry-content-hashes.txt",
              "w",
              encoding="utf-8",
          ) as out:
              out.write("APK ENTRY CONTENT COMPARISON\n")
              out.write("============================\n\n")
              out.write(f"Developer entries: {len(dev)}\n")
              out.write(f"F-Droid entries: {len(fd)}\n")
              out.write(f"Common entries: {len(common)}\n")
              out.write(f"Identical contents: {len(same)}\n")
              out.write(f"Changed contents: {len(changed)}\n")
              out.write(f"Only developer: {len(only_dev)}\n")
              out.write(f"Only F-Droid: {len(only_fd)}\n\n")

              out.write("CHANGED ENTRY CONTENTS\n")
              out.write("=====================\n\n")

              for name, a, b in changed:
                  out.write(f"{name}\n")
                  out.write(f"  developer: {a}\n")
                  out.write(f"  fdroid:    {b}\n\n")

              out.write("ONLY IN DEVELOPER\n")
              out.write("=================\n\n")

              for name in only_dev:
                  out.write(f"{name}\n")

              out.write("\nONLY IN F-DROID\n")
              out.write("===============\n\n")

              for name in only_fd:
                  out.write(f"{name}\n")

          print(
              Path("reports/entry-content-hashes.txt")
              .read_text(encoding="utf-8")
          )
          PY

      - name: Compare DEX directly
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          dev = Path("extracted/developer")
          fd = Path("extracted/fdroid")

          names = sorted(
              {p.name for p in dev.glob("classes*.dex")}
              | {p.name for p in fd.glob("classes*.dex")}
          )

          def sha256(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)

              return h.hexdigest()

          with open("reports/dex-hashes.txt", "w") as out:
              for name in names:
                  a = dev / name
                  b = fd / name

                  out.write(f"{name}\n")

                  if a.exists():
                      out.write(f"  developer: {sha256(a)}\n")
                  else:
                      out.write("  developer: MISSING\n")

                  if b.exists():
                      out.write(f"  fdroid:    {sha256(b)}\n")
                  else:
                      out.write("  fdroid:    MISSING\n")

                  if a.exists() and b.exists():
                      result = (
                          "IDENTICAL"
                          if sha256(a) == sha256(b)
                          else "DIFFERENT"
                      )
                      out.write(f"  result:    {result}\n")

                  out.write("\n")

          PY

          cat reports/dex-hashes.txt

      - name: Compare ZIP entry metadata
        shell: bash
        run: |
          set -euo pipefail

          unzip -lv input/developer.apk \
            > reports/unzip-list-developer.txt

          unzip -lv input/fdroid.apk \
            > reports/unzip-list-fdroid.txt

          diff -u \
            reports/unzip-list-developer.txt \
            reports/unzip-list-fdroid.txt \
            > reports/unzip-list.diff \
            || true

      - name: Run current diffoscope
        shell: bash
        run: |
          set -euo pipefail

          docker pull \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest

          set +e

          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest \
            diffoscope \
              --text-color=never \
              --max-text-report-size=0 \
              input/developer.apk \
              input/fdroid.apk \
            > reports/diffoscope.txt \
            2>&1

          STATUS=$?

          echo "diffoscope exit=$STATUS"

          # 0 = identical
          # 1 = differences found
          # >=2 = diffoscope execution/error
          if [ "$STATUS" -ge 2 ]; then
            exit "$STATUS"
          fi

      - name: Create compact GitHub summary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          entry = Path(
              "reports/entry-content-hashes.txt"
          ).read_text(encoding="utf-8")

          dex = Path(
              "reports/dex-hashes.txt"
          ).read_text(encoding="utf-8")

          stats = [
              x for x in entry.splitlines()
              if x.startswith((
                  "Developer entries:",
                  "F-Droid entries:",
                  "Common entries:",
                  "Identical contents:",
                  "Changed contents:",
                  "Only developer:",
                  "Only F-Droid:",
              ))
          ]

          dex_results = [
              x for x in dex.splitlines()
              if "result:" in x
          ]

          summary = [
              "# APK Comparison",
              "",
              "## Entry contents",
              "",
              "```text",
              *stats,
              "```",
              "",
              "## DEX",
              "",
              "```text",
              *dex_results,
              "```",
              "",
              "Full reports are in the uploaded artifact.",
          ]

          Path(
              "reports/SUMMARY.md"
          ).write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )

          print("\n".join(summary))
          PY

          cat reports/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: apk-comparison-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload extracted APK contents
        uses: actions/upload-artifact@v7
        with:
          name: apk-extracted-contents
          path: extracted/
          if-no-files-found: error
          retention-days: 7
