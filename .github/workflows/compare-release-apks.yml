name: Compare Release APKs

on:
  workflow_dispatch:
    inputs:
      developer_apk_url:
        description: "Direct download URL of the developer release APK"
        required: true
        type: string

      fdroid_apk_url:
        description: "Direct download URL of the F-Droid/GitLab release APK"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare APKs
    runs-on: ubuntu-latest

    steps:
      - name: Install base tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            python3 \
            python3-pip \
            python3-venv \
            docker.io

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 37
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          SDK_ROOT="${ANDROID_SDK_ROOT}"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

          test -d "$SDK_ROOT/platforms/android-37"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"

          echo "Android SDK:"
          sdkmanager --version

          echo
          echo "Android SDK Platform:"
          ls -ld "$SDK_ROOT/platforms/android-37"

          echo
          echo "Build Tools:"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" version

          echo
          echo "zipalign:"
          "$SDK_ROOT/build-tools/36.0.0/zipalign" 2>&1 \
            | sed -n '1,12p' || true

      - name: Install APK analysis tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/apk-tools"

          "$RUNNER_TEMP/apk-tools/bin/python" -m pip install \
            --upgrade pip

          "$RUNNER_TEMP/apk-tools/bin/pip" install \
            "apksigcopier==1.1.1"

          echo "$RUNNER_TEMP/apk-tools/bin" >> "$GITHUB_PATH"

          apksigcopier --version

      - name: Download APKs
        env:
          DEVELOPER_APK_URL: ${{ inputs.developer_apk_url }}
          FDROID_APK_URL: ${{ inputs.fdroid_apk_url }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p input reports

          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$DEVELOPER_APK_URL" \
            --output input/developer.apk

          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            "$FDROID_APK_URL" \
            --output input/fdroid.apk

          test -s input/developer.apk
          test -s input/fdroid.apk

          file input/developer.apk
          file input/fdroid.apk

          ls -lh input/*.apk

      - name: Record APK hashes
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Raw APK SHA-256"
            echo
            echo '```text'
            sha256sum input/developer.apk
            sha256sum input/fdroid.apk
            echo '```'
          } > reports/raw-apk-hashes.md

          cat reports/raw-apk-hashes.md

      - name: Verify APK signatures
        shell: bash
        run: |
          set +e

          {
            echo "===== DEVELOPER APK ====="
            apksigner verify \
              --verbose \
              --print-certs \
              input/developer.apk

            echo
            echo "===== F-DROID APK ====="
            apksigner verify \
              --verbose \
              --print-certs \
              input/fdroid.apk
          } 2>&1 | tee reports/signature-verification.txt

          # Signature status is diagnostic only.
          # A signed developer APK and an unsigned F-Droid APK are valid
          # inputs for the subsequent APK-content comparison.

      - name: Extract APKs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            extracted/developer \
            extracted/fdroid

          unzip -q \
            input/developer.apk \
            -d extracted/developer

          unzip -q \
            input/fdroid.apk \
            -d extracted/fdroid

      - name: Compare APK entry contents
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          roots = {
              "developer": Path("extracted/developer"),
              "fdroid": Path("extracted/fdroid"),
          }

          def collect(root):
              result = {}

              for path in root.rglob("*"):
                  if path.is_file():
                      result[path.relative_to(root).as_posix()] = path

              return result

          def sha256(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()

          developer = collect(roots["developer"])
          fdroid = collect(roots["fdroid"])

          common = sorted(
              set(developer) & set(fdroid)
          )

          only_developer = sorted(
              set(developer) - set(fdroid)
          )

          only_fdroid = sorted(
              set(fdroid) - set(developer)
          )

          identical = []
          changed = []

          for name in common:
              left = sha256(developer[name])
              right = sha256(fdroid[name])

              if left == right:
                  identical.append(name)
              else:
                  changed.append(
                      (name, left, right)
                  )

          with open(
              "reports/entry-content-hashes.txt",
              "w",
              encoding="utf-8"
          ) as out:

              out.write(
                  "APK ENTRY CONTENT COMPARISON\n"
              )
              out.write(
                  "============================\n\n"
              )

              out.write(
                  f"Developer entries: {len(developer)}\n"
              )
              out.write(
                  f"F-Droid entries: {len(fdroid)}\n"
              )
              out.write(
                  f"Common entries: {len(common)}\n"
              )
              out.write(
                  f"Identical contents: {len(identical)}\n"
              )
              out.write(
                  f"Changed contents: {len(changed)}\n"
              )
              out.write(
                  f"Only developer: {len(only_developer)}\n"
              )
              out.write(
                  f"Only F-Droid: {len(only_fdroid)}\n"
              )

              out.write(
                  "\n\nCHANGED ENTRY CONTENTS\n"
              )
              out.write(
                  "=====================\n\n"
              )

              for name, left, right in changed:
                  out.write(f"{name}\n")
                  out.write(
                      f"  developer: {left}\n"
                  )
                  out.write(
                      f"  fdroid:    {right}\n\n"
                  )

              out.write(
                  "ONLY IN DEVELOPER\n"
              )
              out.write(
                  "=================\n\n"
              )

              for name in only_developer:
                  out.write(name + "\n")

              out.write(
                  "\nONLY IN F-DROID\n"
              )
              out.write(
                  "===============\n\n"
              )

              for name in only_fdroid:
                  out.write(name + "\n")

          print(
              Path(
                  "reports/entry-content-hashes.txt"
              ).read_text()
          )
          PY

      - name: Compare DEX hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          developer = Path("extracted/developer")
          fdroid = Path("extracted/fdroid")

          names = sorted(
              {
                  p.name
                  for p in developer.glob("classes*.dex")
              }
              |
              {
                  p.name
                  for p in fdroid.glob("classes*.dex")
              }
          )

          def sha256(path):
              h = hashlib.sha256()

              with path.open("rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()

          with open(
              "reports/dex-hashes.txt",
              "w",
              encoding="utf-8"
          ) as out:

              for name in names:
                  left = developer / name
                  right = fdroid / name

                  out.write(f"{name}\n")

                  if left.exists():
                      left_hash = sha256(left)
                      out.write(
                          f"  developer: {left_hash}\n"
                      )
                  else:
                      out.write(
                          "  developer: MISSING\n"
                      )

                  if right.exists():
                      right_hash = sha256(right)
                      out.write(
                          f"  fdroid:    {right_hash}\n"
                      )
                  else:
                      out.write(
                          "  fdroid:    MISSING\n"
                      )

                  if left.exists() and right.exists():
                      if left_hash == right_hash:
                          out.write(
                              "  result:    IDENTICAL\n"
                          )
                      else:
                          out.write(
                              "  result:    DIFFERENT\n"
                          )

                  out.write("\n")

          cat reports/dex-hashes.txt
          PY

      - name: Compare ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          unzip -lv \
            input/developer.apk \
            > reports/unzip-list-developer.txt

          unzip -lv \
            input/fdroid.apk \
            > reports/unzip-list-fdroid.txt

          diff -u \
            reports/unzip-list-developer.txt \
            reports/unzip-list-fdroid.txt \
            > reports/unzip-list.diff \
            || true

          zipinfo -v \
            input/developer.apk \
            > reports/zipinfo-developer.txt

          zipinfo -v \
            input/fdroid.apk \
            > reports/zipinfo-fdroid.txt

          diff -u \
            reports/zipinfo-developer.txt \
            reports/zipinfo-fdroid.txt \
            > reports/zipinfo.diff \
            || true

      - name: Compare APK signatures with apksigcopier
        shell: bash
        run: |
          set +e

          {
            echo "===== NORMAL COMPARISON ====="
            apksigcopier compare \
              input/developer.apk \
              input/fdroid.apk

            NORMAL_STATUS=$?

            echo
            echo "normal exit=$NORMAL_STATUS"

            echo
            echo "===== UNSIGNED COMPARISON ====="

            apksigcopier compare \
              --unsigned \
              input/developer.apk \
              input/fdroid.apk

            UNSIGNED_STATUS=$?

            echo
            echo "unsigned exit=$UNSIGNED_STATUS"

          } 2>&1 | tee reports/apksigcopier-compare.txt

          # This step is diagnostic. Differences are expected for some
          # signed/unsigned combinations and must not hide diffoscope output.

      - name: Run modern diffoscope
        shell: bash
        run: |
          set -euo pipefail

          docker pull \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest

          set +e

          docker run \
            --rm \
            --volume "$PWD:/work:ro" \
            --workdir /work \
            registry.salsa.debian.org/reproducible-builds/diffoscope:latest \
            diffoscope \
              --text-color=never \
              --max-text-report-size=0 \
              input/developer.apk \
              input/fdroid.apk \
            > reports/diffoscope.txt \
            2>&1

          STATUS=$?

          echo "diffoscope exit=$STATUS"

          # diffoscope:
          # 0 = identical
          # 1 = differences
          # >=2 = tool/runtime error

          if [ "$STATUS" -ge 2 ]; then
            exit "$STATUS"
          fi

      - name: Generate compact summary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          entry = Path(
              "reports/entry-content-hashes.txt"
          ).read_text(
              encoding="utf-8"
          )

          dex = Path(
              "reports/dex-hashes.txt"
          ).read_text(
              encoding="utf-8"
          )

          stats = []

          for line in entry.splitlines():
              if line.startswith((
                  "Developer entries:",
                  "F-Droid entries:",
                  "Common entries:",
                  "Identical contents:",
                  "Changed contents:",
                  "Only developer:",
                  "Only F-Droid:",
              )):
                  stats.append(line)

          dex_results = [
              line
              for line in dex.splitlines()
              if "result:" in line
          ]

          summary = [
              "# APK comparison",
              "",
              "## Entry contents",
              "",
              "```text",
              *stats,
              "```",
              "",
              "## DEX",
              "",
              "```text",
              *dex_results,
              "```",
              "",
              "Full reports are available in the artifact:",
              "",
              "- `entry-content-hashes.txt`",
              "- `dex-hashes.txt`",
              "- `zipinfo.diff`",
              "- `unzip-list.diff`",
              "- `apksigcopier-compare.txt`",
              "- `diffoscope.txt`",
          ]

          Path(
              "reports/GITHUB-SUMMARY.md"
          ).write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8"
          )

          print(
              Path(
                  "reports/GITHUB-SUMMARY.md"
              ).read_text()
          )
          PY

          cat reports/GITHUB-SUMMARY.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: apk-comparison-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload extracted APK contents
        uses: actions/upload-artifact@v7
        with:
          name: apk-extracted-contents
          path: extracted/
          if-no-files-found: error
          retention-days: 7
